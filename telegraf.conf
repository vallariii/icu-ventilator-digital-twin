# Telegraf config for Ventilator Digital Twin.
# Subscribes to all ventilator/+ MQTT topics and forwards to InfluxDB 2.x.

[agent]
  interval = "1s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "ventilator/temperature",
    "ventilator/vibration",
    "ventilator/airflow",
    "ventilator/current",
    "ventilator/pressure",
    "ventilator/alerts",
    "ventilator/twin/state",
  ]
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
